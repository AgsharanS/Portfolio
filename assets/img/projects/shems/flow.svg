<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
<title id="title">SHEMS Backend Flow</title><desc id="desc">A simple portfolio diagram showing the main signal and data flow.</desc>
<defs>
